services:
  face_api:
    build:
      context: ./face_api
    ports:
      - "8001:8001"
    volumes:
      # Models are stored on the host so they survive container rebuilds.
      - ./face_api/models:/app/models
    environment:
      - MODELS_DIR=/app/models
      # Set to 0 on a public deployment to stop visitors triggering downloads.
      - ALLOW_MODEL_DOWNLOAD=${ALLOW_MODEL_DOWNLOAD:-1}
    restart: unless-stopped
    networks:
      - cmeme
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First start may download the core models (~700 MB).
      start_period: 600s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8000:8000"
    environment:
      # Use the Docker service name — "localhost" doesn't work between containers
      - BACKEND_URL=http://face_api:8001
    depends_on:
      - face_api
    restart: unless-stopped
    networks:
      - cmeme

  # Public access through a Cloudflare Tunnel. Only starts with:
  #   docker compose --profile tunnel up
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - cmeme

networks:
  cmeme:
    driver: bridge
